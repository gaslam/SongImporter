name: Windows Deployment
permissions:
  contents: write
on:
  push:
    branches:
      - main
    tags:
      - "Release"

jobs:
 build:
   uses: ./.github/workflows/main.yml
   with:
     upload_artifact: true
 deploy:
  needs: build
  runs-on: windows-2025
  steps:
  - name: Install Qt
    uses: jurplel/install-qt-action@v4
    with:
      aqtversion: '==3.3.*'
      version: ${{needs.build.outputs.qt_version}}
      host: 'windows'
      target: 'desktop'
      arch: ${{needs.build.outputs.qt_arch}}
      install-deps: true
      dir: "${{github.workspace}}/qt"
      cache: true
      tools: 'tools_mingw1310'
      cache-key-prefix: '${{runner.os}}_QT_${{needs.build.outputs.qt_version}}_${{needs.build.outputs.qt_arch}}'
      
  - name: Download artifact
    uses: actions/download-artifact@v4
    with:
     name: workspace-folder
     path: artifacts
          
  - name: "Make deploy folder"
    run: |
      mkdir deploy
      Move-Item -Path artifacts/build/build/appSongImporterGui.exe -Destination ./deploy/appSongImporterGui.exe
      
  - name: "Copy libraries"
    run: |
      Move-Item -Path artifacts/buildSongImporterLib/libSongImporterLib.dll -Destination ./deploy/libSongImporterLib.dll
      Move-Item -Path artifacts/ThirdParty/quazip/bin/libquazip1-qt6.dll -Destination ./deploy/libquazip1-qt6.dll
      Move-Item -Path artifacts/ThirdParty/taglib/bin/libtag.dll -Destination ./deploy/libtag.dll
      Move-Item -Path artifacts/ThirdParty/zlib/bin/libz.dll -Destination ./deploy/libz.dll
      
  - name: "Configure exe"
    run: |
     windeployqt "./deploy/appSongImporterGui.exe" --no-translations --no-opengl-sw --no-system-d3d-compiler --qmldir "artifacts/SongImporterGui/"
     

  - name: Package app
    run: |
      Compress-Archive -Path deploy\* -DestinationPath SongImporterGui-Windows.zip
    
  - name: Release
    uses: softprops/action-gh-release@v2
    with:
     files: SongImporterGui-Windows.zip
      
